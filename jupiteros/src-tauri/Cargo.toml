[package]
name = "jupiteros"
version = "0.1.0"
edition = "2021"

[lib]
name = "jupiteros_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"

# OS credential store (Windows Credential Manager via DPAPI).
# Service name "MoonIo" — same as moon-io.exe CLI uses, so both share the vault.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
