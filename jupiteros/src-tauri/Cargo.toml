[package]
name = "jupiteros"
version = "0.1.0"
edition = "2021"
description = "JupiterOS — desktop chat for Claude + MCP servers (Tauri shell)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/eGancio/jupiter-os"
authors = ["Edoardo Mancinelli <e.mancinelli@brunelleschi.ai>"]

[lib]
name = "jupiteros_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"

# OS credential store (Windows Credential Manager via DPAPI).
# Service name "MoonIo" — same as moon-io.exe CLI uses, so both share the vault.
keyring = { version = "3", features = ["windows-native"] }

# Messaging setup (Moon Europa): Telegram OTP login runs in-process here, sharing
# the same SQLite session file that moon-europa reads at startup.
grammers-client = { version = "0.9", features = ["fs"] }
grammers-session = "0.9"
grammers-mtsender = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# HTTP client for the Teams (Microsoft Graph) OAuth device-code flow.
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }

[profile.release]
opt-level = "s"
strip = true
lto = true
