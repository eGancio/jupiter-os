[package]
name = "moon-himalia-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Moon Himalia - Web research (Tavily) MCP server in Rust"

[[bin]]
name = "moon-himalia"
path = "src/main.rs"

[dependencies]
# MCP Server
rmcp = { version = "0.5", features = ["server", "transport-sse-server", "transport-io"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# JSON schema for MCP tool params
schemars = "1"

# HTTP client for the Tavily API
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
dotenvy = "0.15"
