<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
        }
        .header .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #161b22;
            color: #8b949e;
            border: 1px solid #21262d;
        }
        #chart {
            flex: 1;
            min-height: 0;
        }
        .footer {
            padding: 8px 24px;
            border-top: 1px solid #21262d;
            font-size: 11px;
            color: #484f58;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title }}</h1>
        <span class="badge">Moon Amalthea</span>
    </div>
    <div id="chart"></div>
    <div class="footer">Generated by Moon Amalthea — JupiterOS</div>
    <script>
        var chartDom = document.getElementById('chart');
        var chart = echarts.init(chartDom, 'dark');
        var option = {{ chart_config }};
        chart.setOption(option);
        window.addEventListener('resize', function() { chart.resize(); });
    </script>
</body>
</html>
