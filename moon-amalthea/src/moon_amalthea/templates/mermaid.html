<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
        }
        .header .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #161b22;
            color: #8b949e;
            border: 1px solid #21262d;
        }
        .diagram-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 24px;
            overflow: auto;
        }
        .mermaid {
            max-width: 100%;
        }
        /* Mermaid dark theme overrides */
        .mermaid .node rect,
        .mermaid .node polygon,
        .mermaid .node circle {
            fill: #161b22 !important;
            stroke: #30363d !important;
        }
        .mermaid .nodeLabel,
        .mermaid .label {
            color: #c9d1d9 !important;
        }
        .mermaid .edgePath .path {
            stroke: #58a6ff !important;
        }
        .mermaid .edgeLabel {
            background-color: #0d1117 !important;
            color: #8b949e !important;
        }
        .footer {
            padding: 8px 24px;
            border-top: 1px solid #21262d;
            font-size: 11px;
            color: #484f58;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title }}</h1>
        <span class="badge">Moon Amalthea</span>
    </div>
    <div class="diagram-container">
        <pre class="mermaid">
{{ mermaid_code }}
        </pre>
    </div>
    <div class="footer">Generated by Moon Amalthea — JupiterOS</div>
    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                background: '#0d1117',
                primaryColor: '#161b22',
                primaryTextColor: '#c9d1d9',
                primaryBorderColor: '#30363d',
                lineColor: '#58a6ff',
                secondaryColor: '#1c2333',
                tertiaryColor: '#21262d',
                noteBkgColor: '#161b22',
                noteTextColor: '#c9d1d9',
                noteBorderColor: '#30363d',
                edgeLabelBackground: '#0d1117',
                clusterBkg: '#161b22',
                clusterBorder: '#30363d',
            },
            flowchart: { curve: 'basis', padding: 20 },
            sequence: { mirrorActors: false },
        });
    </script>
</body>
</html>
