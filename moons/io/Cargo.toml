[package]
name = "moon-io-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Moon Io - Email (IMAP/SMTP/CalDAV) MCP server in Rust"

[[bin]]
name = "moon-io"
path = "src/main.rs"

[dependencies]
# Shared library (Qdrant, embeddings, file parsing)
jupiteros-shared = { path = "../../shared" }

# MCP Server
rmcp = { version = "0.5", features = ["server", "transport-sse-server", "transport-io"] }

# Async runtime
tokio = { workspace = true }

# Email - IMAP
async-imap = "0.10"
async-native-tls = "0.5"

# Email - parsing
mail-parser = "0.9"

# Email - SMTP
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# CalDAV (HTTP + XML, no dedicated crate)
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# XML parsing (CalDAV responses + DOCX via shared)
quick-xml = "0.37"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Compat layer (tokio <-> futures_io for async-imap)
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Utilities
async-trait = "0.1"
dirs = "6"
dotenvy = "0.15"
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4"] }
schemars = "1"
futures-util = "0.3"

# Archive extraction (Qdrant binary download)
zip = "2"
flate2 = "1"
tar = "0.4"

# Secrets: native OS credential store. Windows Credential Manager (DPAPI),
# macOS Keychain, and the Linux D-Bus Secret Service (gnome-keyring / KDE
# kwallet-ksecretd). Without a Linux backend keyring v3 silently falls back to
# an in-memory mock store that does NOT persist across processes — which would
# make OAuth tokens vanish between `oauth connect` and the daemon reading them.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

# Hidden password input for CLI setup
rpassword = "7"

# Open the system browser for OAuth consent flow
webbrowser = "1"
# URL building + form_urlencoded for OAuth
url = "2"
# URL-encode Gmail query strings
urlencoding = "2"
# SHA256 for PKCE code_challenge
sha2 = "0.10"
# Cryptographic randomness for PKCE code_verifier + state
getrandom = "0.3"
