[package]
name = "moon-ganymede-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Moon Ganymede - LLM Wiki (operational memory) MCP server in Rust"

[[bin]]
name = "moon-ganymede"
path = "src/main.rs"

[dependencies]
# MCP Server
rmcp = { version = "0.5", features = ["server", "transport-sse-server", "transport-io"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { workspace = true }

# JSON schema for MCP tool params
schemars = "1"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Fuzzy matching for taxonomy suggestions
strsim = "0.11"

# Utilities
dotenvy = "0.15"
regex = "1"
