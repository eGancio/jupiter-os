[package]
name = "moon-metis-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Moon Metis - Knowledge layer (document RAG, citable) MCP server in Rust"

[[bin]]
name = "moon-metis"
path = "src/main.rs"

[dependencies]
# MCP Server
rmcp = { version = "0.5", features = ["server", "transport-sse-server", "transport-io"] }

# Shared infra: Qdrant DocStore + ONNX embeddings + file parsing
jupiteros-shared = { path = "../jupiteros-shared" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# JSON schema for MCP tool params
schemars = "1"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Document extraction (page-aware PDF) — same crate version as jupiteros-shared
pdf-extract = "0.10"

# LLM client (OpenAI-compatible, inherits Jupiter's configured engine).
# Also reused to download the small OCR models on first run.
reqwest = { version = "0.12", features = ["json"] }

# OCR (local, CPU-only) — runs on `rten` (pure-Rust ML runtime), independent of
# the `ort`/ONNX stack used for embeddings, so there is no version conflict and
# no system dependency. Page rasterization is done by `pdftoppm` (poppler), which
# is already a runtime dependency of the `pdftotext` fallback in extract.rs.
ocrs = "0.12"
rten = { version = "0.24", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

# Utilities
dotenvy = "0.15"
regex = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
